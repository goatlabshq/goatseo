[project]
name = "goatseo-django"
version = "0.1.0" # x-release-please-version
description = "Django integration for GoatSEO."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Louis Midson LAJEANTY", email = "midsonlajeanty@proton.me" }]
requires-python = ">=3.14"
keywords = ["seo", "schema.org", "json-ld", "opengraph", "twitter-cards", "metadata"]
classifiers = [
    "Framework :: Django",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Typing :: Typed",
]
dependencies = [
    "goatseo-seo==0.1.0", # x-release-please-version
    "django>=5.2",
]

[project.urls]
Homepage = "https://github.com/midsonlajeanty/goatseo"
Documentation = "https://midsonlajeanty.github.io/goatseo/"
Issues = "https://github.com/midsonlajeanty/goatseo/issues"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "goatseo.django"

[tool.uv.sources]
goatseo-seo = { workspace = true }
