[project]
name = "goatseo-seo"
version = "0.1.0" # x-release-please-version
description = "High-level SEO API combining metadata, Open Graph, Twitter Cards and Schema.org."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Louis Midson LAJEANTY", email = "midsonlajeanty@proton.me" }]
requires-python = ">=3.14"
keywords = ["seo", "schema.org", "json-ld", "opengraph", "twitter-cards", "metadata"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Typing :: Typed",
]
dependencies = [
    "goatseo-core==0.1.0", # x-release-please-version
    "goatseo-schema==0.1.0", # x-release-please-version
    "goatseo-opengraph==0.1.0", # x-release-please-version
    "goatseo-twitter==0.1.0", # x-release-please-version
]

[project.urls]
Homepage = "https://github.com/midsonlajeanty/goatseo"
Documentation = "https://midsonlajeanty.github.io/goatseo/"
Issues = "https://github.com/midsonlajeanty/goatseo/issues"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "goatseo.seo"

[tool.uv.sources]
goatseo-core = { workspace = true }
goatseo-schema = { workspace = true }
goatseo-opengraph = { workspace = true }
goatseo-twitter = { workspace = true }
